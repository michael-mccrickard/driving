name: Apply gap indicators

on:
  push:
    branches:
      - parallax-background

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply play-mode gap indicators
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          terrain_path = Path("scripts/levels/terrain_base.gd")
          text = terrain_path.read_text()

          old_vars = '''var _gap_label_layer: CanvasLayer
          var _gap_labels: Array[Label] = []
          var _author_mode := false

          const GAP_LABEL_FONT_SIZE := 48
          const GAP_LABEL_SCREEN_Y_FRACTION := 0.333
          const GAP_LABEL_WIDTH := 120.0
          '''.replace("          ", "")

          new_vars = '''class GapIndicator extends Control:
              var number := 0
              var opacity := 0.0

              const DIAMETER := 56.0
              const RADIUS := 26.0
              const CIRCLE_WIDTH := 3.5
              const FONT_SIZE := 30

              func _ready() -> void:
                  custom_minimum_size = Vector2(DIAMETER, DIAMETER)
                  mouse_filter = Control.MOUSE_FILTER_IGNORE
                  queue_redraw()

              func _draw() -> void:
                  var white := Color(1.0, 1.0, 1.0, opacity)
                  var center := Vector2(DIAMETER * 0.5, DIAMETER * 0.5)
                  draw_arc(center, RADIUS, 0.0, TAU, 48, white, CIRCLE_WIDTH, true)

                  var font := ThemeDB.fallback_font
                  var text := str(number)
                  var ascent := font.get_ascent(FONT_SIZE)
                  var descent := font.get_descent(FONT_SIZE)
                  var baseline := center.y + (ascent - descent) * 0.5
                  draw_string(
                      font,
                      Vector2(0.0, baseline),
                      text,
                      HORIZONTAL_ALIGNMENT_CENTER,
                      DIAMETER,
                      FONT_SIZE,
                      white
                  )

              func set_indicator(number_value: int, opacity_value: float) -> void:
                  number = number_value
                  opacity = opacity_value
                  queue_redraw()


          var _gap_label_layer: CanvasLayer
          var _gap_labels: Array[Label] = []
          var _gap_indicators: Array[GapIndicator] = []
          var _author_mode := false

          const GAP_LABEL_FONT_SIZE := 48
          const GAP_LABEL_SCREEN_Y_FRACTION := 0.333
          const GAP_LABEL_WIDTH := 120.0
          const GAP_INDICATOR_SCREEN_Y_FRACTION := 0.20
          const GAP_INDICATOR_FADE_DISTANCE := 1500.0
          '''.replace("              ", "\t").replace("          ", "")

          if old_vars not in text:
              raise SystemExit("Expected gap-label variables were not found")
          text = text.replace(old_vars, new_vars, 1)

          marker = "func set_author_mode(authoring: bool) -> void"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Expected set_author_mode() was not found")

          new_tail = '''func set_author_mode(authoring: bool) -> void:
              _author_mode = authoring
              _build_gap_labels()


          ## Supplies the car used to measure distance for the play-mode gap
          ## indicators. The runtime scene keeps the car beside the level, so
          ## the indicator code also has a fallback lookup for robustness.
          func set_gap_indicator_target(target: Node2D) -> void:
              _gap_indicator_target = target
              _update_gap_indicators()


          func _build_gap_labels() -> void:
              _clear_gap_labels()
              _clear_gap_indicators()
              if _gaps_in_effect.is_empty():
                  return

              if _author_mode:
                  if _gap_label_layer == null:
                      _gap_label_layer = CanvasLayer.new()
                      _gap_label_layer.name = "GapLabels"
                      _gap_label_layer.layer = 100
                      add_child(_gap_label_layer)
                  for i in _gaps_in_effect.size():
                      var label := Label.new()
                      label.text = "G%d" % i
                      label.add_theme_font_size_override("font_size", GAP_LABEL_FONT_SIZE)
                      label.add_theme_color_override("font_color", Color.WHITE)
                      label.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
                      label.mouse_filter = Control.MOUSE_FILTER_IGNORE
                      label.size = Vector2(GAP_LABEL_WIDTH, GAP_LABEL_FONT_SIZE + 12.0)
                      _gap_label_layer.add_child(label)
                      _gap_labels.append(label)
                  _update_gap_labels()
              else:
                  _build_gap_indicators()


          func _build_gap_indicators() -> void:
              if _gap_label_layer == null:
                  _gap_label_layer = CanvasLayer.new()
                  _gap_label_layer.name = "GapLabels"
                  _gap_label_layer.layer = 100
                  add_child(_gap_label_layer)
              for i in _gaps_in_effect.size():
                  var indicator := GapIndicator.new()
                  indicator.set_indicator(i + 1, 0.0)
                  _gap_label_layer.add_child(indicator)
                  _gap_indicators.append(indicator)
              _update_gap_indicators()


          func _clear_gap_labels() -> void:
              for label in _gap_labels:
                  if is_instance_valid(label):
                      label.free()
              _gap_labels.clear()


          func _clear_gap_indicators() -> void:
              for indicator in _gap_indicators:
                  if is_instance_valid(indicator):
                      indicator.free()
              _gap_indicators.clear()


          func _process(_delta: float) -> void:
              if _author_mode and not _gap_labels.is_empty():
                  _update_gap_labels()
              elif not _author_mode and not _gap_indicators.is_empty():
                  _update_gap_indicators()


          func _update_gap_labels() -> void:
              if _gap_labels.is_empty():
                  return
              var viewport_size := get_viewport_rect().size
              var screen_y := viewport_size.y * GAP_LABEL_SCREEN_Y_FRACTION
              var canvas_transform := get_viewport().get_canvas_transform()
              for i in mini(_gap_labels.size(), _gaps_in_effect.size()):
                  var gap := _gaps_in_effect[i]
                  var center := to_global(Vector2(gap.x + gap.y * 0.5, 0.0))
                  var screen_position := canvas_transform * center
                  var label := _gap_labels[i]
                  label.position = Vector2(screen_position.x - GAP_LABEL_WIDTH * 0.5, screen_y)


          func _update_gap_indicators() -> void:
              if _gap_indicators.is_empty():
                  return

              var target := _gap_indicator_target
              if not is_instance_valid(target):
                  target = get_tree().current_scene.get_node_or_null("Car") as Node2D
              if target == null:
                  return

              var viewport_size := get_viewport_rect().size
              var screen_y := viewport_size.y * GAP_INDICATOR_SCREEN_Y_FRACTION
              var canvas_transform := get_viewport().get_canvas_transform()
              var car_x := target.global_position.x

              for i in mini(_gap_indicators.size(), _gaps_in_effect.size()):
                  var gap := _gaps_in_effect[i]
                  var gap_center := to_global(Vector2(gap.x + gap.y * 0.5, 0.0))
                  var screen_position := canvas_transform * gap_center
                  var distance := absf(gap_center.x - car_x)
                  var progress := 1.0 - clampf(distance / GAP_INDICATOR_FADE_DISTANCE, 0.0, 1.0)
                  var opacity := smoothstep(0.0, 1.0, progress)

                  var indicator := _gap_indicators[i]
                  indicator.set_indicator(i + 1, opacity)
                  indicator.position = Vector2(
                      screen_position.x - GapIndicator.DIAMETER * 0.5,
                      screen_y - GapIndicator.DIAMETER * 0.5
                  )
          '''.replace("              ", "\t").replace("          ", "")

          # The label code is the final block in TerrainBase, so replace it to EOF.
          text = text[:start] + new_tail + "\n"
          # Add the target variable alongside the existing gap-display state.
          needle = "var _gap_indicators: Array[GapIndicator] = []\n"
          if needle not in text:
              raise SystemExit("Expected gap indicator array was not inserted")
          text = text.replace(needle, needle + "var _gap_indicator_target: Node2D\n", 1)
          terrain_path.write_text(text)

          print("Updated TerrainBase gap display")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/levels/terrain_base.gd
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add fading numbered gap indicators"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-gap-indicators.yml
          git commit -m "Remove temporary gap indicator workflow"
          git push
