name: Fix gap indicator indentation

on:
  push:
    branches:
      - parallax-background

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize gap indicator block
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/levels/terrain_base.gd")
          text = path.read_text()
          start = text.find("class GapIndicator extends Control:")
          end_marker = "# --- What a subclass supplies -------------------------------------------------"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Gap indicator block not found")

          block = '''class GapIndicator extends Control:
\tvar number := 0
\tvar opacity := 0.0

\tconst DIAMETER := 56.0
\tconst RADIUS := 26.0
\tconst CIRCLE_WIDTH := 3.5
\tconst FONT_SIZE := 30

\tfunc _ready() -> void:
\t\tcustom_minimum_size = Vector2(DIAMETER, DIAMETER)
\t\tmouse_filter = Control.MOUSE_FILTER_IGNORE
\t\tqueue_redraw()

\tfunc _draw() -> void:
\t\tvar white := Color(1.0, 1.0, 1.0, opacity)
\t\tvar center := Vector2(DIAMETER * 0.5, DIAMETER * 0.5)
\t\tdraw_arc(center, RADIUS, 0.0, TAU, 48, white, CIRCLE_WIDTH, true)

\t\tvar font := ThemeDB.fallback_font
\t\tvar text := str(number)
\t\tvar ascent := font.get_ascent(FONT_SIZE)
\t\tvar descent := font.get_descent(FONT_SIZE)
\t\tvar baseline := center.y + (ascent - descent) * 0.5
\t\tdraw_string(
\t\t\tfont,
\t\t\tVector2(0.0, baseline),
\t\t\ttext,
\t\t\tHORIZONTAL_ALIGNMENT_CENTER,
\t\t\tDIAMETER,
\t\t\tFONT_SIZE,
\t\t\twhite
\t\t)

\tfunc set_indicator(number_value: int, opacity_value: float) -> void:
\t\tnumber = number_value
\t\topacity = opacity_value
\t\tqueue_redraw()


var _gap_label_layer: CanvasLayer
var _gap_labels: Array[Label] = []
var _gap_indicators: Array[GapIndicator] = []
var _gap_indicator_target: Node2D
var _author_mode := false

const GAP_LABEL_FONT_SIZE := 48
const GAP_LABEL_SCREEN_Y_FRACTION := 0.333
const GAP_LABEL_WIDTH := 120.0
const GAP_INDICATOR_SCREEN_Y_FRACTION := 0.20
const GAP_INDICATOR_FADE_DISTANCE := 1500.0


'''
          text = text[:start] + block + text[end:]

          start = text.find("func set_author_mode(authoring: bool) -> void")
          if start < 0:
              raise SystemExit("set_author_mode block not found")
          # This is the final block in TerrainBase; replace it to EOF.
          tail = '''func set_author_mode(authoring: bool) -> void:
\t_author_mode = authoring
\t_build_gap_labels()


## Supplies the car used to measure distance for the play-mode gap
## indicators. The runtime scene keeps the car beside the level, so
## the indicator code also has a fallback lookup for robustness.
func set_gap_indicator_target(target: Node2D) -> void:
\t_gap_indicator_target = target
\t_update_gap_indicators()


func _build_gap_labels() -> void:
\t_clear_gap_labels()
\t_clear_gap_indicators()
\tif _gaps_in_effect.is_empty():
\t\treturn

\tif _author_mode:
\t\tif _gap_label_layer == null:
\t\t\t_gap_label_layer = CanvasLayer.new()
\t\t\t_gap_label_layer.name = "GapLabels"
\t\t\t_gap_label_layer.layer = 100
\t\t\tadd_child(_gap_label_layer)
\t\tfor i in _gaps_in_effect.size():
\t\t\tvar label := Label.new()
\t\t\tlabel.text = "G%d" % i
\t\t\tlabel.add_theme_font_size_override("font_size", GAP_LABEL_FONT_SIZE)
\t\t\tlabel.add_theme_color_override("font_color", Color.WHITE)
\t\t\tlabel.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
\t\t\tlabel.mouse_filter = Control.MOUSE_FILTER_IGNORE
\t\t\tlabel.size = Vector2(GAP_LABEL_WIDTH, GAP_LABEL_FONT_SIZE + 12.0)
\t\t\t_gap_label_layer.add_child(label)
\t\t\t_gap_labels.append(label)
\t\t_update_gap_labels()
\telse:
\t\t_build_gap_indicators()


func _build_gap_indicators() -> void:
\tif _gap_label_layer == null:
\t\t_gap_label_layer = CanvasLayer.new()
\t\t_gap_label_layer.name = "GapLabels"
\t\t_gap_label_layer.layer = 100
\t\tadd_child(_gap_label_layer)
\tfor i in _gaps_in_effect.size():
\t\tvar indicator := GapIndicator.new()
\t\tindicator.set_indicator(i + 1, 0.0)
\t\t_gap_label_layer.add_child(indicator)
\t\t_gap_indicators.append(indicator)
\t_update_gap_indicators()


func _clear_gap_labels() -> void:
\tfor label in _gap_labels:
\t\tif is_instance_valid(label):
\t\t\tlabel.free()
\t_gap_labels.clear()


func _clear_gap_indicators() -> void:
\tfor indicator in _gap_indicators:
\t\tif is_instance_valid(indicator):
\t\t\tindicator.free()
\t_gap_indicators.clear()


func _process(_delta: float) -> void:
\tif _author_mode and not _gap_labels.is_empty():
\t\t_update_gap_labels()
\telif not _author_mode and not _gap_indicators.is_empty():
\t\t_update_gap_indicators()


func _update_gap_labels() -> void:
\tif _gap_labels.is_empty():
\t\treturn
\tvar viewport_size := get_viewport_rect().size
\tvar screen_y := viewport_size.y * GAP_LABEL_SCREEN_Y_FRACTION
\tvar canvas_transform := get_viewport().get_canvas_transform()
\tfor i in mini(_gap_labels.size(), _gaps_in_effect.size()):
\t\tvar gap := _gaps_in_effect[i]
\t\tvar center := to_global(Vector2(gap.x + gap.y * 0.5, 0.0))
\t\tvar screen_position := canvas_transform * center
\t\tvar label := _gap_labels[i]
\t\tlabel.position = Vector2(screen_position.x - GAP_LABEL_WIDTH * 0.5, screen_y)


func _update_gap_indicators() -> void:
\tif _gap_indicators.is_empty():
\t\treturn

\tvar target := _gap_indicator_target
\tif not is_instance_valid(target):
\t\ttarget = get_tree().current_scene.get_node_or_null("Car") as Node2D
\tif target == null:
\t\treturn

\tvar viewport_size := get_viewport_rect().size
\tvar screen_y := viewport_size.y * GAP_INDICATOR_SCREEN_Y_FRACTION
\tvar canvas_transform := get_viewport().get_canvas_transform()
\tvar car_x := target.global_position.x

\tfor i in mini(_gap_indicators.size(), _gaps_in_effect.size()):
\t\tvar gap := _gaps_in_effect[i]
\t\tvar gap_center := to_global(Vector2(gap.x + gap.y * 0.5, 0.0))
\t\tvar screen_position := canvas_transform * gap_center
\t\tvar distance := absf(gap_center.x - car_x)
\t\tvar progress := 1.0 - clampf(distance / GAP_INDICATOR_FADE_DISTANCE, 0.0, 1.0)
\t\tvar opacity := smoothstep(0.0, 1.0, progress)

\t\tvar indicator := _gap_indicators[i]
\t\tindicator.set_indicator(i + 1, opacity)
\t\tindicator.position = Vector2(
\t\t\tscreen_position.x - GapIndicator.DIAMETER * 0.5,
\t\t\tscreen_y - GapIndicator.DIAMETER * 0.5
\t\t)
'''
          text = text[:start] + tail + "\n"
          path.write_text(text)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/levels/terrain_base.gd
          git commit -m "Fix gap indicator formatting" || true
          git rm .github/workflows/fix-gap-indicator-indent.yml
          git commit -m "Remove temporary gap indicator fix workflow"
          git push
